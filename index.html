<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUN3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--ink:#0f1c26;--muted:#6b7884;--line:rgba(15,28,38,.08);--glass:rgba(255,255,255,.82);--solid:#fff;--soft:rgba(15,28,38,.05);--accent:#7a4dff;--danger:#e5484d;--page:#f4f6f8;--shadow:0 8px 32px rgba(15,28,38,.14),0 1px 2px rgba(15,28,38,.08);--r:18px}
@media(prefers-color-scheme:dark){:root{--ink:#eef3f7;--muted:#93a1ad;--line:rgba(255,255,255,.1);--glass:rgba(22,32,41,.8);--solid:#16202a;--soft:rgba(255,255,255,.07);--shadow:0 8px 32px rgba(0,0,0,.45);--page:#0d151c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#dfe5ea}
#map{position:absolute;inset:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}
#logo{display:flex;align-items:center;gap:9px;padding:9px 15px 9px 11px;border-radius:999px;font-weight:800;font-size:17px}
#logo span.dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff}
#logo svg{width:13px;height:13px;stroke-width:2.6}
#top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:25;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#search{position:relative;flex:1;max-width:400px}
.field{display:flex;align-items:center;gap:9px;height:42px;padding:0 6px 0 14px;border-radius:999px;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink)}
#q::placeholder{color:var(--muted)}
#qClear{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
#qClear[hidden],#results[hidden]{display:none}
#results{position:absolute;top:50px;left:0;right:0;margin:0;padding:6px;list-style:none;border-radius:20px;max-height:360px;overflow:auto;background:var(--solid)}
#results li{padding:10px 12px;border-radius:13px;cursor:pointer}
#results li.active,#results li:hover{background:var(--soft)}
.r-name{font-weight:700;font-size:14px}.r-sub{font-size:12px;color:var(--muted);margin-top:1px}
.r-head,.r-empty{cursor:default!important;font-size:12px;font-weight:700;color:var(--muted)}
#controls{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px}
body.routing #controls{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.fab{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;transition:transform .15s}
.fab:hover{transform:translateY(-1px)}.fab.primary{background:var(--accent);color:#fff}.fab.on{background:var(--ink);color:var(--solid)}
body.routing .fab.primary svg{transform:rotate(45deg)}
.user-location{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px rgba(122,77,255,.25)}
.route-point{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.route-point.start{border-color:var(--accent)}
#routePanel{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:30;width:max-content;max-width:calc(100% - 24px);border-radius:22px;padding:7px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;transition:.3s}
body.routing #routePanel{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.stats{display:flex;flex-direction:column;line-height:1.2;padding:0 8px 0 10px}
#distance{font-size:19px;font-weight:800}.stats small{font-size:12px;font-weight:700;color:var(--muted);margin-left:3px}
#elevation{font-size:11px;font-weight:700;color:var(--muted)}
.modes{display:flex;gap:2px;padding:3px;border-radius:13px;background:var(--soft)}
.mode{width:36px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.mode.active{background:var(--solid);color:var(--ink);box-shadow:0 1px 6px rgba(15,28,38,.16)}
.mode:disabled{opacity:.5}.actions{display:flex;gap:2px;align-items:center}
.pbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.pbtn:hover{background:var(--soft)}.pbtn.danger{color:var(--danger)}.pbtn:disabled{opacity:.35}
.pbtn.finish{width:40px;height:40px;margin-left:4px;border-radius:13px;background:var(--accent);color:#fff}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft)}
.my-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.h-item{padding:14px 14px 14px 16px;border-radius:16px;background:var(--soft);cursor:pointer;display:flex;gap:12px;align-items:center}
.h-body{flex:1;min-width:0}.h-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.h-date{font-size:12px;color:var(--muted);margin-top:2px}
.h-stats{display:flex;gap:14px;margin-top:10px;font-size:13px;font-weight:700}.h-stats em{font-style:normal;color:var(--muted);font-weight:600;margin-right:3px}
.h-del{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--danger)}
#racesPage{position:absolute;inset:0;z-index:60;background:var(--page);display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .35s,visibility 0s .35s;padding-top:env(safe-area-inset-top,0px)}
#racesPage.show{transform:none;visibility:visible;transition:transform .35s,visibility 0s}
.rp-head{display:flex;align-items:center;gap:12px;padding:16px 20px 12px;max-width:960px;width:100%;margin:auto}
.rp-title{font-size:22px;font-weight:800}.rp-body{flex:1;overflow:auto;padding-bottom:32px}.rp-wrap{max-width:960px;margin:auto;padding:4px 20px}
.rp-tabs{display:flex;gap:8px;max-width:960px;width:100%;margin:0 auto;padding:0 20px 8px;box-sizing:border-box}.rp-tab{flex:1;padding:11px 0;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;font-size:14px}.rp-tab.active{background:var(--accent);color:#fff}
.rp-search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:15px;background:var(--solid);border:1px solid var(--line);color:var(--muted)}
.rp-search input{flex:1;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink)}
.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}.chip{padding:9px 16px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:14px;font-weight:700;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.45}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.race{display:flex;gap:14px;padding:16px;border-radius:20px;background:var(--solid);border:1px solid var(--line);cursor:pointer}.race.past{opacity:.55}.race:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.race-date{width:58px;align-self:flex-start;flex:none;border-radius:14px;overflow:hidden;background:var(--soft);display:flex;flex-direction:column;align-items:stretch;text-align:center;line-height:1.1;padding-bottom:6px}.race-date .rd-m{display:block;padding:4px 0;background:var(--accent);color:#fff;font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.race-date b{font-size:24px;font-weight:800;line-height:1;margin:7px 0 3px}.race-date span.yr{font-size:11px;font-weight:600;color:var(--muted)}
.race-main{min-width:0;flex:1}.race-name{font-weight:800;font-size:16px}.race-city{font-size:13px;color:var(--muted);margin-top:2px}.race-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft)}.tag.dist{background:var(--accent);color:#fff}.tag.warn{background:rgba(229,72,77,.12);color:var(--danger)}
.d-hero{padding:6px 0 18px}.d-hero h1{margin:10px 0 4px;font-size:28px;line-height:1.15}.d-hero p{margin:0;color:var(--muted)}
.d-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:700px){.d-stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px;border-radius:18px;background:var(--solid);border:1px solid var(--line)}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat b{font-size:20px}
.card{padding:18px;border-radius:20px;background:var(--solid);border:1px solid var(--line);margin-bottom:12px}.card h3{margin:0 0 12px;font-size:16px}.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-of-type{border-top:0}.kv span{color:var(--muted)}.kv b{text-align:right}.na{color:var(--muted);font-weight:600}
.d-actions{display:flex;gap:10px;flex-wrap:wrap}.cta{display:flex;align-items:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:14px}.cta.secondary{background:var(--soft);color:var(--ink)}
.src a{display:block;padding:8px 0;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;overflow-wrap:anywhere}.d-note{font-size:13px;color:var(--muted);line-height:1.45}
#modal{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(10,18,26,.4);padding:20px}#modal.show{display:flex}.dialog{width:min(380px,100%);background:var(--solid);border-radius:24px;padding:22px;box-shadow:var(--shadow)max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}.dialog h3{margin:0 0 6px}.dialog p{margin:0 0 16px;color:var(--muted);font-size:14px}.dialog input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:inherit;margin-bottom:16px}.dialog .row{display:flex;gap:8px;justify-content:flex-end}.btn{padding:12px 18px;border-radius:13px;background:var(--soft);font-weight:700}.btn.solid{background:var(--ink);color:var(--solid)}.btn.danger{background:var(--danger);color:#fff}
#toast{position:absolute;top:16px;left:50%;transform:translate(-50%,-90px);z-index:80;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--solid);font-size:14px;font-weight:600;max-width:calc(100% - 32px);transition:.3s;box-shadow:var(--shadow)}#toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:40px 24px}.empty strong{display:block;color:var(--ink);margin-bottom:4px}

/* Fiche course compacte RUN3D */
.race-main-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.race-stat{padding:12px;border:1px solid var(--border,#ddd);border-radius:12px;text-align:center}
.race-stat span{display:block;font-size:20px;margin-bottom:4px}
.race-stat strong{display:block;font-size:17px}
.race-stat small,.race-data-card small{display:block;opacity:.65;font-size:11px;margin-top:3px}
.race-locations{display:grid;gap:8px;margin:12px 0}
.race-locations div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border,#eee)}
.race-locations span{opacity:.65}
.race-locations strong{text-align:right}
.race-section-title{font-weight:800;margin:18px 0 10px}
.race-data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.race-data-card{padding:12px;border:1px solid var(--border,#ddd);border-radius:12px}
.race-data-card span{font-size:18px}
.race-data-card strong{display:block;font-size:18px;margin-top:4px}
.race-surface{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.race-surface div{display:flex;align-items:center;gap:8px;padding:11px;border-radius:12px;background:rgba(127,127,127,.08)}
.race-surface b{margin-left:auto}
.race-elevation-placeholder{min-height:70px;padding:14px;border:1px solid var(--border,#ddd);border-radius:12px}
.elevation-summary{display:flex;justify-content:space-between;margin-bottom:12px;font-size:12px;opacity:.75}
.elevation-bar{height:80px;position:relative;overflow:hidden;border-radius:8px;background:linear-gradient(to top,rgba(127,127,127,.08),transparent)}
.elevation-line{position:absolute;left:4%;right:4%;bottom:24px;height:38px;border-top:3px solid currentColor;transform:skewY(-3deg);opacity:.8}
.race-elevation-placeholder small{display:block;margin-top:10px;opacity:.6}
.race-map-btn{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;font-weight:800;cursor:pointer}
@media(max-width:520px){.race-main-stats{grid-template-columns:1fr 1fr 1fr}.race-locations div{display:block}.race-locations strong{display:block;text-align:left;margin-top:3px}}


/* Overlay statistiques du parcours de course */
.race-map-stats{
  position:fixed;
  z-index:50;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:min(760px,calc(100vw - 28px));
  box-sizing:border-box;
  padding:14px 16px 15px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:rgba(18,20,24,.94);
  color:#fff;
  box-shadow:0 10px 35px rgba(0,0,0,.28);
  backdrop-filter:blur(14px);
}
.race-map-stats-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.race-map-stats-kicker{
  font-size:10px;
  font-weight:800;
  letter-spacing:.12em;
  opacity:.62;
  margin-bottom:3px;
}
.race-map-stats-title{
  font-size:18px;
  font-weight:850;
  line-height:1.15;
}
.race-map-stats-sub{
  margin-top:3px;
  font-size:12px;
  opacity:.68;
}
.race-map-stats-close{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.1);
  color:#fff;
  font-size:23px;
  line-height:1;
  cursor:pointer;
}
.race-map-stat-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:12px;
}
.race-map-stat-grid>div{
  min-width:0;
  padding:9px 8px;
  border-radius:11px;
  background:rgba(255,255,255,.075);
  text-align:center;
}
.race-map-stat-grid strong{
  display:block;
  font-size:16px;
  font-weight:850;
  white-space:nowrap;
}
.race-map-stat-grid span{
  display:block;
  margin-top:2px;
  font-size:10px;
  opacity:.6;
  white-space:nowrap;
}
@media(max-width:620px){
  .race-map-stats{top:8px;padding:11px 11px 12px;border-radius:15px}
  .race-map-stats-title{font-size:16px}
  .race-map-stat-grid{grid-template-columns:repeat(3,1fr)}
  .race-map-stat-grid strong{font-size:14px}
}


/* Quand le panneau du parcours est affiché, la recherche disparaît pour laisser toute la place à la carte. */
body.race-route-active .race-search-hidden,
body.race-route-active #searchPanel,
body.race-route-active #searchBox,
body.race-route-active #search,
body.race-route-active #searchWrap,
body.race-route-active #searchContainer,
body.race-route-active #searchOverlay,
body.race-route-active #mapSearch,
body.race-route-active #searchBar{
  display:none !important;
}

.race-del{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--danger)}
.cr-form{display:grid;gap:10px;max-height:62vh;overflow:auto;margin-bottom:16px}
.cr-form label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.cr-form input{width:100%}
.cr-form select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--soft);font:inherit;color:var(--ink)}
#raceEstimate{margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.est-btn{padding:10px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
#estOut{flex:1;min-width:180px}.est-main{font-size:20px;font-weight:850}.est-sub{font-size:12px;opacity:.7;margin-top:2px}
.est-exact{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;margin:8px 0;padding:9px 11px;border-radius:11px;background:rgba(122,77,255,.18);border:1px solid rgba(160,130,255,.35)}
.est-exact span{font-size:11px;font-weight:800}.est-exact strong{grid-row:1/3;grid-column:2;font-size:19px}.est-exact small{font-size:11px;opacity:.72}
.race-map-stats{max-height:85vh;overflow:auto}
#raceProfile{margin-top:12px}
.est-splits{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;margin-top:8px}
.est-chip{padding:5px 4px 4px;border-radius:8px;background:rgba(255,255,255,.075);border-bottom:3px solid transparent;text-align:center}
.est-chip small{display:block;font-size:9px;opacity:.6}.est-chip b{font-size:13px}
.prof-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7a4dff}
.race-map-stats{width:min(600px,calc(100vw - 28px));padding:10px 12px 11px;border-radius:16px}
.race-map-stats-kicker{display:none}
.race-map-stats-head{align-items:center;gap:10px}
.race-map-stats-head>div:first-child{min-width:0;flex:1}
.race-map-stats-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-map-stats-sub{font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-acts{display:flex;align-items:center;gap:6px;flex:none}
.rm-acts .est-btn{padding:7px 11px;font-size:12px}
.race-map-stats-close,.rm-tog{width:30px;height:30px;border-radius:9px;font-size:20px}
.rm-tog{border:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.race-map-stats.mini .rm-tog{transform:rotate(180deg)}
.race-map-stats.mini .race-map-stat-grid,.race-map-stats.mini #raceProfile,.race-map-stats.mini #raceEstimate{display:none}
.race-map-stat-grid{grid-template-columns:repeat(5,1fr)!important;gap:5px;margin-top:8px}
.race-map-stat-grid>div{padding:5px 4px;border-radius:9px}
.race-map-stat-grid strong{font-size:13px!important}
.race-map-stat-grid span{font-size:9px;margin-top:0}
#raceProfile{margin-top:8px}
#raceProfile svg{height:40px!important}
#profReadout{font-size:10px;margin-top:2px}
#raceEstimate{margin-top:0}
#estOut:not(:empty){margin-top:8px;flex-basis:100%}
.est-main{font-size:16px;display:inline-block;margin-right:8px}
.est-main+.est-sub{display:inline}
.est-splits{display:flex;flex-wrap:wrap;overflow:visible;gap:5px}
.est-chip{flex:0 0 auto;min-width:54px}
.run-pin{width:20px;height:25px;filter:drop-shadow(0 1px 2px rgba(15,28,38,.4))}
.run-pin svg{display:block}
.run-pin.start .pin-body,.run-pin.loop .pin-body{fill:var(--accent)}
.run-pin.end .pin-body{fill:#0f1c26}
.es-sub{margin:-2px 0 14px!important;font-size:13px!important}
.es-form{display:grid;gap:16px;margin-bottom:18px;flex:1;min-height:0;overflow-y:auto;}
.dialog:has(.es-form){max-height:85vh;}
.es-lab{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.es-seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--soft)}
.es-seg button{flex:1;padding:10px 4px;border-radius:11px;font-size:13px;font-weight:700;color:var(--muted)}
.es-seg button.on{background:var(--accent);color:#fff}
.dialog .es-time{margin:0 0 8px;padding:12px;font-size:24px;font-weight:800;text-align:center;letter-spacing:.02em}
.dialog .es-small{margin:8px 0 0;padding:11px;font-size:14px;display:none}

.est-tbl{column-width:200px;column-gap:20px;margin-top:6px}

    </label>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* =========================
   CARTE
========================= */
const map=new maplibregl.Map({
  container:'map',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:[2.3522,48.8566],
  zoom:12,pitch:0,bearing:0,maxPitch:85,
  attributionControl:{customAttribution:'Altitude : Open-Meteo · Copernicus DEM'}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');

const $=id=>document.getElementById(id);
const ICON_2D='<svg class="i" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>';
const ICON_3D='<svg class="i" viewBox="0 0 24 24"><path d="M3 19l6-10 4 6 3-4 5 8z"/></svg>';
const ICON_TRASH='<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const ICON_RUN='<svg class="i" viewBox="0 0 24 24"><path d="M3 18l6-9 4 6 3-4 5 7z"/></svg>';

let userMarker=null,routePoints=[],routeMarkers=[],routeSegments=[],routeCoordinates=[];
let routeActive=false,totalDistance=0,totalAscent=0,totalDescent=0;
let elevationRequestId=0,elevationLoading=false,segmentCalculationInProgress=false;
let nextSegmentMode='routes',displayedSavedRoute=null,terrainEnabled=false,terrainReady=false,satelliteEnabled=false;

/* =========================
   OUTILS
========================= */
function escapeHtml(text){const d=document.createElement('div');d.textContent=String(text);return d.innerHTML;}
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}
function distanceBetweenCoordinates(a,b){
  const r=v=>v*Math.PI/180,la1=r(a[1]),la2=r(b[1]),dLa=r(b[1]-a[1]),dLo=r(b[0]-a[0]);
  const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;
  return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
function updateDistance(){$('distance').innerHTML=totalDistance.toFixed(2)+'<small>km</small>';}
function updateElevationDisplay(){$('elevation').textContent=`D+ ${totalAscent} m · D− ${totalDescent} m`;}
function decodePolyline6(str){
  let index=0,lat=0,lon=0,coords=[];
  while(index<str.length){
    let result=0,shift=0,byte;
    do{byte=str.charCodeAt(index++)-63;result|=(byte&31)<<shift;shift+=5;}while(byte>=32);
    lat+=(result&1)?~(result>>1):(result>>1);
    result=0;shift=0;
    do{byte=str.charCodeAt(index++)-63;result|=(byte&31)<<shift;shift+=5;}while(byte>=32);
    lon+=(result&1)?~(result>>1):(result>>1);
    coords.push([lon/1e6,lat/1e6]);
  }
  return coords;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* =========================
   RELIEF 3D
========================= */
function setupTerrain(){
  map.addSource('terrain-dem',{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:15});
  const firstSymbol=map.getStyle().layers.find(l=>l.type==='symbol');
  map.addLayer({id:'terrain-hillshade',type:'hillshade',source:'terrain-dem',
    paint:{'hillshade-method':'standard','hillshade-illumination-direction':315,'hillshade-exaggeration':.55},
    layout:{visibility:'none'}},firstSymbol?firstSymbol.id:undefined);
  map.addSource('satellite',{type:'raster',tiles:[SAT_TILES],tileSize:256,maxzoom:19,attribution:SAT_ATTRIBUTION});
  map.addLayer({id:'satellite',type:'raster',source:'satellite',layout:{visibility:'none'},paint:SAT_LOOK},map.getStyle().layers.find(l=>l.type!=='background')?.id);
  terrainReady=true;updateTerrainButton();updateSatButton();
}
const SAT_TILES='https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const SAT_ATTRIBUTION='© IGN Géoportail';
const SAT_LOOK={'raster-saturation':.25,'raster-contrast':.15,'raster-brightness-min':.04,'raster-brightness-max':1};
const ICON_SAT='<svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>';
let satHidden=[],satRoads={};
const SAT_ROADS_OPACITY={major:.6,minor:.4};
function applyHillshade(){if(map.getLayer('terrain-hillshade'))map.setLayoutProperty('terrain-hillshade','visibility',terrainEnabled&&!satelliteEnabled?'visible':'none')}
function toggleSatellite(){
  if(!terrainReady){toast('La carte est encore en cours de chargement.');return}
  satelliteEnabled=!satelliteEnabled;map.setLayoutProperty('satellite','visibility',satelliteEnabled?'visible':'none');
  const isRoad=l=>l.type==='line'&&l['source-layer']==='transportation';
  if(satelliteEnabled){
    const vis=map.getStyle().layers.filter(l=>l.layout?.visibility!=='none'&&!/^(route|saved-route|race-route)-/.test(l.id));
    satHidden=vis.filter(l=>['fill','line','fill-extrusion','circle'].includes(l.type)&&!isRoad(l)).map(l=>l.id);
    satHidden.forEach(id=>map.setLayoutProperty(id,'visibility','none'));satRoads={};
    vis.filter(isRoad).forEach(l=>{satRoads[l.id]=map.getPaintProperty(l.id,'line-opacity');map.setPaintProperty(l.id,'line-opacity',/motorway|trunk|primary|secondary/i.test(l.id)?SAT_ROADS_OPACITY.major:SAT_ROADS_OPACITY.minor)});
  }else{
    satHidden.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility','visible')});satHidden=[];
    Object.keys(satRoads).forEach(id=>{if(map.getLayer(id))map.setPaintProperty(id,'line-opacity',satRoads[id]===undefined?1:satRoads[id])});satRoads={};
  }
  applyHillshade();updateSatButton();
}
function updateSatButton(){const b=$('satToggle');if(!b)return;b.innerHTML=ICON_SAT;b.classList.toggle('on',satelliteEnabled)}
function toggleTerrain(){
  if(!terrainReady){toast('Le relief est encore en cours de chargement.');return;}
  terrainEnabled=!terrainEnabled;
  map.setTerrain(terrainEnabled?{source:'terrain-dem',exaggeration:1.4}:null);
  applyHillshade();
  map.easeTo({pitch:terrainEnabled?58:0,bearing:terrainEnabled?-20:0,duration:1000});
  updateTerrainButton();
}
function updateTerrainButton(){
  $('terrainToggle').innerHTML=terrainEnabled?ICON_3D:ICON_2D;
  $('terrainToggle').classList.toggle('on',terrainEnabled);
}

/* =========================
   GEOLOCALISATION
========================= */
function getLocation(){
  if(!navigator.geolocation){toast("La géolocalisation n'est pas disponible.");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const p=[pos.coords.longitude,pos.coords.latitude];
    if(userMarker)userMarker.remove();
    const el=document.createElement('div');el.className='user-location';
    userMarker=new maplibregl.Marker({element:el}).setLngLat(p).addTo(map);
    map.flyTo({center:p,zoom:15,speed:1.2});
  },()=>toast("Impossible d'obtenir votre position."),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

/* =========================
   CREATION DE PARCOURS
========================= */
function changeRouteMode(mode){
  if(segmentCalculationInProgress||!['routes','free'].includes(mode))return;
  nextSegmentMode=mode;
  $('modeRoutes').classList.toggle('active',mode==='routes');
  $('modeFree').classList.toggle('active',mode==='free');
}
function updateRouteControls(){
  $('modeRoutes').disabled=$('modeFree').disabled=segmentCalculationInProgress;
  $('undoButton').disabled=segmentCalculationInProgress||routePoints.length===0;
  $('clearButton').disabled=segmentCalculationInProgress;
  $('saveButton').disabled=segmentCalculationInProgress||elevationLoading;
}
function resetElevation(){
  elevationRequestId++;elevationLoading=false;totalAscent=0;totalDescent=0;updateElevationDisplay();updateRouteControls();
}
function toggleRoute(){if(segmentCalculationInProgress)return;routeActive?cancelRoute():startRoute();}
function startRoute(){
  clearRoute();clearDisplayedSavedRoute();$('raceMapStats').hidden=true;clearDisplayedRaceRoute();document.body.classList.remove('race-route-active');
  routeActive=true;customRaceMode=false;nextSegmentMode='routes';
  $('modeRoutes').classList.add('active');$('modeFree').classList.remove('active');
  document.body.classList.add('routing');map.getCanvas().style.cursor='crosshair';
  $('routeToggle').title='Annuler la création';updateRouteControls();toast('Touchez la carte pour placer le départ');
}
function cancelRoute(){customRaceMode=false;$('saveButton').title='Sauvegarder';
  clearRoute();routeActive=false;map.getCanvas().style.cursor='';document.body.classList.remove('routing');$('routeToggle').title='Créer un parcours';
}
function createRouteMarker(point,isStart){
  if(isStart)return new maplibregl.Marker({element:makePinEl('start','Départ'),anchor:'bottom'}).setLngLat(point).addTo(map);
  const el=document.createElement('div');el.className='route-point';
  return new maplibregl.Marker({element:el}).setLngLat(point).addTo(map);
}
async function calculateSegment(start,end,mode){
  if(mode==='free')return{start:[...start],end:[...end],mode,coordinates:[[...start],[...end]],distance:distanceBetweenCoordinates(start,end)/1000};
  const request={locations:[{lat:start[1],lon:start[0],type:'break'},{lat:end[1],lon:end[0],type:'break'}],costing:'pedestrian',units:'kilometers',shape_format:'geojson'};
  const response=await fetch('https://valhalla1.openstreetmap.de/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});
  if(!response.ok)throw new Error('Erreur Valhalla');
  const data=await response.json();
  if(!data.trip?.legs?.[0])throw new Error('Aucun itinéraire trouvé');
  return{start:[...start],end:[...end],mode:'routes',coordinates:getSegmentCoordinates(data.trip.legs[0].shape),distance:Number(data.trip.summary.length)};
}
function getSegmentCoordinates(shape){
  if(shape?.type==='LineString')return shape.coordinates;
  if(shape?.type==='Feature'&&shape.geometry?.coordinates)return shape.geometry.coordinates;
  if(Array.isArray(shape))return shape;
  if(typeof shape==='string')return decodePolyline6(shape);
  throw new Error('Format de tracé non reconnu');

   ALTITUDE
========================= */
const elevCache=new Map(),elevKey=p=>p[1].toFixed(5)+','+p[0].toFixed(5);
function sampleRouteCoordinates(coords){
  if(coords.length<2)return coords;
  const samples=[coords[0]],step=90;let since=0;
  for(let i=1;i<coords.length;i++){
    const a=coords[i-1],b=coords[i],d=distanceBetweenCoordinates(a,b);
    if(d<.01)continue;
    let consumed=0;
    while(since+(d-consumed)>=step){
      consumed+=step-since;const ratio=consumed/d;
      samples.push([a[0]+(b[0]-a[0])*ratio,a[1]+(b[1]-a[1])*ratio]);since=0;
    }
    since+=d-consumed;
  }
  const last=coords.at(-1),ls=samples.at(-1);
  if(last[0]!==ls[0]||last[1]!==ls[1])samples.push(last);
  return samples;
}
async function fetchElevationBatch(batch){
  const url='https://api.open-meteo.com/v1/elevation?latitude='+encodeURIComponent(batch.map(p=>p[1]).join(','))+'&longitude='+encodeURIComponent(batch.map(p=>p[0]).join(','));
  for(let attempt=0;attempt<3;attempt++){
    try{
      const res=await fetch(url);if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();if(!Array.isArray(data.elevation)||data.elevation.length!==batch.length)throw new Error('Altitude invalide');
      return data.elevation;
    }catch(e){if(attempt===2)throw e;await sleep(800*(attempt+1));}
  }
}
async function getElevations(coords){
  const missing=[],seen=new Set();
  coords.forEach(p=>{const k=elevKey(p);if(!elevCache.has(k)&&!seen.has(k)){seen.add(k);missing.push(p);}});
  for(let i=0;i<missing.length;i+=100){
    const batch=missing.slice(i,i+100),values=await fetchElevationBatch(batch);
    batch.forEach((p,j)=>elevCache.set(elevKey(p),values[j]));
  }
  return coords.map(p=>elevCache.get(elevKey(p)));
}
async function updateElevation(){
  const id=++elevationRequestId;
  if(routeCoordinates.length<2){resetElevation();return;}
  elevationLoading=true;$('elevation').textContent='Calcul du dénivelé…';updateRouteControls();
  try{
    const sm=sampleRouteCoordinates(routeCoordinates),elevations=await getElevations(sm);if(id!==elevationRequestId)return;
    let up=0,down=0;
    for(let i=1;i<elevations.length;i++){const d=elevations[i]-elevations[i-1];if(d>=3)up+=d;else if(d<=-3)down-=d;}
    totalAscent=Math.round(up);totalDescent=Math.round(down);updateElevationDisplay();
    const pr=buildProfile(sm,elevations);if(pr&&map.getLayer('route-line'))map.setPaintProperty('route-line','line-gradient',slopeGradient(pr));
  }catch(e){console.error(e);$('elevation').textContent='Dénivelé indisponible';}
  finally{if(id===elevationRequestId){elevationLoading=false;updateRouteControls();}}
}

      .forEach(id=>{const el=$(id);if(el)el.textContent='…'});
  }

  toast('Chargement du tracé GPS…');

  try{
    const gpxText=await readRaceGpx(r);
    const xml=new DOMParser().parseFromString(gpxText,'application/xml');
    if(xml.querySelector('parsererror'))throw new Error('GPX invalide');

    const points=[...xml.querySelectorAll('trkpt')].map(p=>({
      lon:+p.getAttribute('lon'),
      lat:+p.getAttribute('lat'),
      ele:p.querySelector('ele') ? +p.querySelector('ele').textContent : NaN
    })).filter(p=>Number.isFinite(p.lon)&&Number.isFinite(p.lat));

    if(points.length<2)throw new Error('Aucun tracé GPS trouvé');

    const coords=points.map(p=>[p.lon,p.lat]);

    let dplus=0,dminus=0;

    const set=(id,value)=>{const el=$(id);if(el)el.textContent=value};
    set('raceMapDistance',distanceKm.toFixed(2)+' km');applyOfficialProfile(r,coords,points.map(p=>p.ele));
    set('raceMapDplus',Math.round(dplus)+' m');

}

const normalizeRace=r=>{
  const typeMap={'21km':'semi','21.1km':'semi','42km':'marathon','42.195km':'marathon'};
  const type=typeMap[String(r.type||'').toLowerCase()]||r.type;
  const sources=Array.isArray(r.sources)?r.sources.map(s=>({
    label:String(s?.label||'Source'),

  return {...r,type,sources};

let LOCAL_GPX_FILES=new Map();
const gpxFileName=r=>String(r.gpxUrl||r.gpx2025Url||'').split('/').pop();
const gpxOf=r=>r.gpxUrl||r.gpx2025Url||'';
async function chooseLocalGpxFolder(){
  if(!window.showDirectoryPicker){toast('Utilisez Edge ou Chrome pour choisir le dossier GPX.');return;}
  try{
    const dir=await window.showDirectoryPicker({mode:'read'}),files=new Map();
    for await(const [name,handle] of dir.entries())if(handle.kind==='file'&&name.toLowerCase().endsWith('.gpx'))files.set(name.toLowerCase(),handle);
    LOCAL_GPX_FILES=files;toast(files.size+' fichiers GPX disponibles pour cette session.');updateRaceGrid();
  }catch(e){if(e.name!=='AbortError'){console.error(e);toast('Impossible de lire le dossier GPX.');}}
}
async function readRaceGpx(r){
  const name=gpxFileName(r),handle=LOCAL_GPX_FILES.get(name.toLowerCase());
  if(handle)return await (await handle.getFile()).text();
  if(location.protocol==='file:')throw new Error('LOCAL_GPX_FOLDER_REQUIRED');
  const res=await fetch(gpxOf(r),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);return await res.text();
}

async function loadRacesJson(){
  let list=null;
  try{
    const res=await fetch('./data/races.json',{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    list=Array.isArray(d)?d:d.races;
    if(!Array.isArray(list)||!list.length)throw new Error('JSON vide ou invalide');
    RACES_ORIGIN='data/races.json';
  }catch(e){
    console.warn('Chargement direct de races.json impossible :',e);
    list=EMBEDDED_RACES;
    RACES_ORIGIN='secours intégré ('+list.length+' courses)';
    if(location.protocol==='file:'){
      toast(list.length+' courses chargées. Cliquez sur Choisir le dossier GPX pour afficher les tracés.');
    }else{
      toast('races.json indisponible : données intégrées utilisées.');
    }
  }
  RACES=list.map(normalizeRace);
  console.info(RACES.length+' parcours chargés depuis '+RACES_ORIGIN,RACES);
  if($('racesPage').classList.contains('show')&&raceView==='list')updateRaceGrid();
}

function isPast(r){if(!r.date)return false;const t=new Date(),n=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');return r.date<n}

  </div>`}
function updateRaceGrid(){
  if(!$('rpGrid'))return;
  const q=raceQuery.trim().toLowerCase();
  const list=RACES.filter(r=>!r.custom&&(raceFilter==='all'||r.type===raceFilter)&&(!q||(r.name+' '+r.city+' '+r.event).toLowerCase().includes(q))).sort((a,b)=>{const pa=isPast(a),pb=isPast(b);if(pa!==pb)return pa?1:-1;const c=(a.date||'9999').localeCompare(b.date||'9999');return pa?-c:c});
  $('rpGrid').innerHTML=list.length?list.map(raceCard).join(''):`<div class="empty">Aucune course trouvée.</div>`;

function haversineKm(a,b){const t=x=>x*Math.PI/180,dLa=t(b[1]-a[1]),dLo=t(b[0]-a[0]),h=Math.sin(dLa/2)**2+Math.cos(t(a[1]))*Math.cos(t(b[1]))*Math.sin(dLo/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function importGpxRace(file){
  if(!file)return;
  try{
    toast('Lecture du GPX…');
    const xml=new DOMParser().parseFromString(await file.text(),'application/xml');
    if(xml.querySelector('parsererror'))throw new Error('GPX invalide');
    let pts=[...xml.querySelectorAll('trkpt')];if(pts.length<2)pts=[...xml.querySelectorAll('rtept')];
    pts=pts.map(p=>({c:[+(+p.getAttribute('lon')).toFixed(6),+(+p.getAttribute('lat')).toFixed(6)],e:p.querySelector('ele')?+p.querySelector('ele').textContent:NaN})).filter(p=>Number.isFinite(p.c[0])&&Number.isFinite(p.c[1]));
    if(pts.length<2)throw new Error('Aucun tracé GPS trouvé');
    const step=Math.ceil(pts.length/2500);if(step>1)pts=pts.filter((_,i)=>i%step===0||i===pts.length-1);
    const coords=pts.map(p=>p.c);let ele=pts.map(p=>p.e),km=0;
    for(let i=1;i<coords.length;i++)km+=haversineKm(coords[i-1],coords[i]);
    const okEle=ele.filter(Number.isFinite);
    if(!(okEle.length>=ele.length*0.95&&Math.max(...okEle)-Math.min(...okEle)>=2)){
      try{ele=await getElevations(sampleRouteCoordinates(coords))}catch{ele=[]}
    }
    const el=ele.filter(Number.isFinite),[up,down]=el.length>1?gainLoss(el):[0,0];
    const gpxName=xml.querySelector('trk > name, metadata > name, rte > name')?.textContent?.trim()||file.name.replace(/\.gpx$/i,'');
    const f=await raceForm({name:gpxName});if(!f)return;
    const list=getCustomRaces();
    list.unshift({id:Date.now(),custom:true,type:'perso',name:f.name,event:'Course perso',city:f.city||'—',lat:coords[0][1],lon:coords[0][0],date:f.date||null,start:f.start||'À confirmer',startLocation:f.from||'—',finishLocation:f.to||'—',surface:f.surface,note:f.note,distance:+km.toFixed(2),ascent:Math.round(up),descent:Math.round(down),minAlt:el.length?Math.round(Math.min(...el)):null,maxAlt:el.length?Math.round(Math.max(...el)):null,coordinates:coords,points:[coords[0],coords.at(-1)]});
    try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(list))}catch{toast('Stockage saturé ou indisponible.');return}
    racesTab='mine';raceFilter='all';raceQuery='';showRaceList();toast('Course importée : '+km.toFixed(2)+' km');
  }catch(e){console.error(e);toast('Import GPX impossible : '+e.message)}
}
function exportCustomRaces(){
  const l=getCustomRaces();if(!l.length){toast('Aucune course perso à sauvegarder.');return}
  downloadBlob(JSON.stringify({app:'RUN3D',version:1,exported:new Date().toISOString(),customRaces:l}),'run3d-courses-'+new Date().toISOString().slice(0,10)+'.json','application/json');
  toast(l.length+' course(s) sauvegardée(s)');
}
async function importCustomRaces(file){
  if(!file)return;
  try{
    const d=JSON.parse(await file.text()),inc=Array.isArray(d)?d:d.customRaces;
    if(!Array.isArray(inc))throw new Error('format inattendu');
    const ok=inc.filter(r=>r&&Array.isArray(r.coordinates)&&r.coordinates.length>1&&r.name);
    if(!ok.length)throw new Error('aucune course valide (tracé manquant)');
    const cur=getCustomRaces(),ids=new Set(cur.map(r=>r.id));let n=0;
    ok.forEach(r=>{if(!ids.has(r.id)){cur.push({...r,custom:true,type:'perso'});ids.add(r.id);n++}});
    localStorage.setItem(CUSTOM_KEY,JSON.stringify(cur));
    racesTab='mine';showRaceList();toast(n+' course(s) ajoutée(s), '+(ok.length-n)+' déjà présente(s)');
  }catch(e){console.error(e);toast('Restauration impossible : '+e.message)}
}

function officialDistanceForRace(r,D){

function slopeColor(s){const a=SLOPE_STOPS;let c;if(s<=a[0][0])c=a[0][1];else if(s>=a.at(-1)[0])c=a.at(-1)[1];else{let i=0;while(s>a[i+1][0])i++;const t=(s-a[i][0])/(a[i+1][0]-a[i][0]);c=a[i][1].map((v,k)=>Math.round(v+(a[i+1][1][k]-v)*t))}return `rgb(${c})`}
function gainLoss(arr,thr=3){if(arr.length<2)return[0,0];let ref=arr[0],up=0,down=0;for(const v of arr){if(v-ref>=thr){up+=v-ref;ref=v}else if(ref-v>=thr){down+=ref-v;ref=v}}return[up,down]}
function buildProfile(coords,elevs){
  const pts=[];let cum=0;
  for(let i=0;i<coords.length;i++){if(i)cum+=distanceBetweenCoordinates(coords[i-1],coords[i]);if(Number.isFinite(elevs[i]))pts.push([cum,elevs[i],coords[i][0],coords[i][1]])}
  if(pts.length<2||pts.at(-1)[0]<50)return null;
  const total=pts.at(-1)[0],N=Math.min(160,Math.max(20,Math.round(total/60))),d=[],e=[],c=[];let j=0;
  for(let k=0;k<=N;k++){const x=total*k/N;while(j<pts.length-2&&pts[j+1][0]<x)j++;const a=pts[j],b=pts[j+1],t=b[0]>a[0]?Math.min(1,Math.max(0,(x-a[0])/(b[0]-a[0]))):0;d.push(x);e.push(a[1]+(b[1]-a[1])*t);c.push([a[2]+(b[2]-a[2])*t,a[3]+(b[3]-a[3])*t])}

function kmSplits(p){const n=Math.ceil(p.total/1000),o=[];for(let k=0;k<n;k++)o.push({len:Math.min(1,p.total/1000-k),up:0,down:0});for(let i=1;i<p.d.length;i++){const k=Math.min(n-1,Math.floor((p.d[i-1]+p.d[i])/2000)),de=p.e[i]-p.e[i-1];if(de>0)o[k].up+=de;else o[k].down-=de}return o}

<script>

const SB_URL='https://aadejjggmfikzqleestb.supabase.co';
const SB_KEY='sb_publishable_xVhWZC0K85xHK8YAvzJq4Q_ZfEsOOdH';

const sb=(window.supabase&&window.supabase.createClient)

      auth:{
        persistSession:true,

const SYNC_TABLES=[{table:'routes',key:'run3d_routes'},{table:'custom_races',key:'run3d_custom_races'}];
const SETTING_KEYS=['run3d_runner','run3d_target_time'];
const WATCHED=new Set([...SYNC_TABLES.map(t=>t.key),...SETTING_KEYS]);
let sbUser=null,sbApplying=false,sbPushTimer=null,sbSyncing=false,sbAgain=false,sbReady=false,sbWarned=false;

/* Détecte toute écriture dans les clés synchronisées, sans toucher au reste du code */
const _lsSet=Storage.prototype.setItem;
Storage.prototype.setItem=function(k,v){_lsSet.call(this,k,v);if(this===localStorage&&!sbApplying&&sbUser&&sbReady&&WATCHED.has(k))schedulePush()};

const lsRead=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const lsApply=(k,v)=>{sbApplying=true;try{if(v==null)localStorage.removeItem(k);else _lsSet.call(localStorage,k,typeof v==='string'?v:JSON.stringify(v))}catch{}finally{sbApplying=false}};
const syncedKey=t=>`run3d_synced_${sbUser.id}_${t}`;

function normalizeList(list){
  let changed=false;const seen=new Set();
  const out=(Array.isArray(list)?list:[]).filter(x=>x&&typeof x==='object').map(x=>{
    let id=Number(x.id);
    if(!Number.isSafeInteger(id)||id<=0||seen.has(id)){id=Date.now()+seen.size+Math.floor(Math.random()*1000);x={...x,id};changed=true}
    seen.add(id);return x;
  });
  return{out,changed};
}
function refreshAfterSync(){
  try{renderHistory()}catch{}
  try{updateRaceGrid()}catch{}
}
function syncWarn(e){
  console.error('Sync',e);
  if(!sbWarned){sbWarned=true;toast('Synchronisation impossible pour le moment. Nouvelle tentative plus tard.')}
}

async function pullMerge(){
  if(!sb||!sbUser)return;
  for(const {table,key} of SYNC_TABLES){
    const {data:rows,error}=await sb.from(table).select('id,data');
    if(error)throw error;
    const cloud=new Map(rows.map(r=>[String(r.id),r.data]));
    const {out:local,changed}=normalizeList(lsRead(key,[]));
    if(changed)lsApply(key,local);
    const synced=new Set(lsRead(syncedKey(table),[]).map(String));
    const localIds=new Set(local.map(x=>String(x.id)));
    const merged=[];
    local.forEach(it=>{
      const id=String(it.id);
      if(cloud.has(id))merged.push(cloud.get(id));
      else if(!synced.has(id))merged.push(it);          /* nouveau sur cet appareil : sera envoyé */
      /* sinon : supprimé depuis un autre appareil, on l'écarte */
    });
    cloud.forEach((v,id)=>{if(!localIds.has(id)&&!synced.has(id))merged.push(v)});
    merged.sort((a,b)=>Number(b.id)-Number(a.id));
    lsApply(key,merged);
    lsApply(syncedKey(table),[...cloud.keys()]);        /* ce qui existe déjà dans le cloud */
  }
  /* réglages coureur */
  const {data:st,error:e2}=await sb.from('user_settings').select('runner,target_time').maybeSingle();
  if(e2)throw e2;
  if(st){
    if(st.runner&&Object.keys(st.runner).length)lsApply('run3d_runner',st.runner);
    if(st.target_time)lsApply('run3d_target_time',st.target_time);
  }
  await pushAll(true);
  refreshAfterSync();
}

function schedulePush(){clearTimeout(sbPushTimer);sbPushTimer=setTimeout(()=>pushAll().catch(syncWarn),1500)}

async function pushAll(force){
  if(!sb||!sbUser)return;
  if(sbSyncing){sbAgain=true;return}
  sbSyncing=true;
  try{
    do{
      sbAgain=false;
      for(const {table,key} of SYNC_TABLES){
        const {out:list,changed}=normalizeList(lsRead(key,[]));
        if(changed)lsApply(key,list);
        const ids=list.map(x=>String(x.id));
        const synced=new Set(lsRead(syncedKey(table),[]).map(String));
        const fresh=list.filter(x=>!synced.has(String(x.id)));
        if(fresh.length){
          const now=new Date().toISOString();
          for(let i=0;i<fresh.length;i+=20){
            const chunk=fresh.slice(i,i+20).map(it=>({user_id:sbUser.id,id:Number(it.id),data:it,updated_at:now}));
            const {error}=await sb.from(table).upsert(chunk,{onConflict:'user_id,id'});
            if(error)throw error;
          }
        }
        const removed=[...synced].filter(id=>!ids.includes(id));
        if(removed.length){
          const {error}=await sb.from(table).delete().in('id',removed.map(Number));
          if(error)throw error;
        }
        lsApply(syncedKey(table),ids);
      }
      const runner=lsRead('run3d_runner',null),target=localStorage.getItem('run3d_target_time');
      if(force||runner||target){
        if(runner||target){
          const {error}=await sb.from('user_settings').upsert({user_id:sbUser.id,runner:runner||null,target_time:target||null,updated_at:new Date().toISOString()},{onConflict:'user_id'});
          if(error)throw error;
        }
      }
      sbWarned=false;
    }while(sbAgain);
  }finally{sbSyncing=false}
}

function wipeLocalPersonal(uid){
  [...SYNC_TABLES.map(t=>t.key),...SETTING_KEYS].forEach(k=>lsApply(k,null));
  if(uid)SYNC_TABLES.forEach(t=>lsApply(`run3d_synced_${uid}_${t.table}`,null));
  refreshAfterSync();
}

if(sb){
  let lastUid=null;
  sb.auth.onAuthStateChange((event,session)=>{
    /* setTimeout : évite d'appeler Supabase à l'intérieur du callback (risque de blocage) */
    setTimeout(async()=>{
      if(event==='PASSWORD_RECOVERY'){sbUser=session&&session.user;sbReady=false;updateAccountButton();openNewPassword();return}
      if(session&&session.user){
        sbUser=session.user;updateAccountButton();
        if(lastUid!==sbUser.id){
          lastUid=sbUser.id;sbReady=false;
          try{await pullMerge();sbReady=true;if(event==='SIGNED_IN')toast('Synchronisé')}catch(e){syncWarn(e);sbReady=true}
        }
      }else{
        const uid=lastUid;sbUser=null;lastUid=null;sbReady=false;updateAccountButton();
        if(event==='SIGNED_OUT'&&uid)wipeLocalPersonal(uid);
      }
    },0);
  });
}
updateAccountButton();

</script>
